<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregador de Conteúdo</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --link-color: #e74c3c;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }
        .content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .card h3 {
            font-size: 1.1rem;
            color: #333;
            margin: 0 0 10px 0;
            line-height: 1.4;
        }
        .date {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 15px;
        }
        .card a {
            text-decoration: none;
            color: #fff;
            background-color: var(--link-color);
            padding: 10px 15px;
            text-align: center;
            border-radius: 4px;
            font-weight: bold;
            margin-top: auto;
            transition: background 0.3s;
        }
        .card a:hover {
            background-color: #c0392b;
        }
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: #666;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Agregador de Publicações</h1>
        <p>Últimas atualizações extraídas automaticamente</p>
    </header>

    <div class="grid" id="feed-container">
        <div class="loading">Buscando as publicações mais recentes...</div>
    </div>
</div>

<script>
    // URL do feed RSS do site alvo
    const targetUrl = 'https://xvazado.com/feed/';
    
    // Serviço público que atua como proxy para converter RSS em JSON e ignorar o CORS
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(targetUrl)}&api_key=`;

    fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('feed-container');
            container.innerHTML = ''; // Limpa a mensagem de carregamento

            if (data.status === 'ok' && data.items.length > 0) {
                data.items.forEach(item => {
                    // Tenta extrair a melhor imagem disponível (thumbnail do feed ou imagem do corpo)
                    let imageUrl = item.thumbnail;
                    if (!imageUrl && item.description) {
                        const imgMatch = item.description.match(/<img[^>]+src="([^">]+)"/i);
                        imageUrl = imgMatch ? imgMatch[1] : 'https://via.placeholder.com/400x250?text=Sem+Imagem';
                    } else if (!imageUrl) {
                        imageUrl = 'https://via.placeholder.com/400x250?text=Sem+Imagem';
                    }

                    // Formata a data
                    const pubDate = new Date(item.pubDate).toLocaleDateString('pt-BR', {
                        day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    // Monta o elemento visual do post
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${imageUrl}" alt="Imagem de capa" loading="lazy">
                        <div class="content">
                            <h3>${item.title}</h3>
                            <span class="date">${pubDate}</span>
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer">Acessar Postagem</a>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = '<div class="loading">Nenhuma publicação encontrada no momento ou o Feed RSS está inativo.</div>';
            }
        })
        .catch(error => {
            console.error('Erro de requisição:', error);
            document.getElementById('feed-container').innerHTML = 
                '<div class="loading" style="color: #e74c3c;">Erro ao conectar com o site original. Tente novamente mais tarde.</div>';
        });
</script>

</body>
</html>
